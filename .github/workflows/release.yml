name: Release

# A tag that names a version publishes it to PyPI. Nothing else does.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# The same groups as CI's lint job (ci.yml): pyrefly checks the integrations against every library they wrap.
env:
  GROUPS: >-
    --group celery --group channels --group strawberry --group django-tasks --group django-q2 --group fastapi --group dramatiq
    --group rq --group ninja --group drf --group flask --group falcon --group otel --group clients
    --group faststream --group postgres --group drivers --group bench

jobs:
  # Nothing is published before CI has passed on the tagged commit: the run that main's push made, not a new one.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") echo "CI passed on $GITHUB_SHA" && exit 0 ;;
              completed*) echo "::error::CI on $GITHUB_SHA: $result" && exit 1 ;;
              # No run of main on this commit: tag a commit of main, after its CI.
              "null null") [ "$attempt" -ge 10 ] && echo "::error::no CI run of main on $GITHUB_SHA" && exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA still runs" && exit 1

  release:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/tracepanel/
    permissions:
      # What PyPI's trusted publishing signs the upload with, in place of a token.
      id-token: write
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          working-directory: tracepanel-python

      # A minor is released with the agent's, a patch on its own: the agent's pin covers this version's minor.
      - name: The tag is the version, and the agent's pin covers its minor
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          agent = next(Requirement(dep) for dep in project["dependencies"] if dep.startswith("tracepanel-agent"))
          tag, version = Version(os.environ["GITHUB_REF_NAME"]), Version(project["version"])
          major, minor = version.release[:2]
          lower = next((Version(s.version) for s in agent.specifier if s.operator == ">="), None)
          covers = (
              lower is not None
              and lower.release[:2] == (major, minor)
              and {s.operator + s.version for s in agent.specifier} == {f">={lower}", f"<{major}.{minor + 1}"}
          )
          if tag != version or not covers:
              sys.exit(f"::error::tag {tag}, version {version}, agent {agent.specifier}: the tag must be the version, "
                       f"the agent >={major}.{minor}.N,<{major}.{minor + 1}")
          EOF

      # mysqlclient (the drivers group) builds against the MySQL client library.
      - run: sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev

      # What a user installs: the newest published agent the pin allows.
      - name: The published agent
        id: agent
        env:
          UV_NO_SYNC: "1"
        run: |
          uv sync --no-sources $GROUPS
          echo "version=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('tracepanel-agent'))")" >> "$GITHUB_OUTPUT"

      # The schemas of that agent's release.
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ steps.agent.outputs.version }}
          path: tracepanel
          sparse-checkout: schema

      - name: Lint and test against the published agent
        # poe runs each task through `uv run`, which would sync again with the sources and build the agent from
        # ../tracepanel, where only schema/ is checked out. The environment synced above, with the published agent, is
        # the one to check.
        env:
          UV_NO_SYNC: "1"
        run: |
          uv run --no-sync poe lint
          TRACEPANEL_AGENT_BIN=$PWD/.venv/bin/tracepanel-agent uv run --no-sync pytest

      - name: Build
        run: uv build && uv run --no-project python scripts/check_dist.py

      - name: Publish
        run: uv publish --trusted-publishing always

  # The release on GitHub, after the registry took it: its notes are the changelog's entry for the version.
  github:
    name: GitHub release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## $GITHUB_REF_NAME " 'index($0, head) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME" && exit 1; fi
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*-*) pre=--prerelease ;;
            *) pre= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
