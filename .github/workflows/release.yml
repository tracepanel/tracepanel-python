name: Release

# A tag that names a version publishes it to PyPI. Nothing else does. Run by hand with `testpypi`, it publishes to
# TestPyPI instead, without the tests against the published agent.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

env:
  GROUPS: >-
    --group celery --group channels --group strawberry --group django-tasks --group fastapi --group dramatiq
    --group rq --group ninja --group drf --group flask --group falcon --group otel

jobs:
  release:
    name: Publish to ${{ github.ref_type == 'tag' && 'PyPI' || 'TestPyPI' }}
    if: github.ref_type == 'tag' || inputs.testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_type == 'tag' && 'pypi' || 'testpypi' }}
      url: https://${{ github.ref_type == 'tag' && 'pypi.org' || 'test.pypi.org' }}/project/tracepanel/
    permissions:
      # What PyPI's trusted publishing signs the upload with, in place of a token.
      id-token: write
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          working-directory: tracepanel-python

      - name: The tag is the version, and the agent's
        if: github.ref_type == 'tag'
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          agent = next(Requirement(dep) for dep in project["dependencies"] if dep.startswith("tracepanel-agent"))
          tag, version = Version(os.environ["GITHUB_REF_NAME"]), Version(project["version"])
          if not tag == version or str(agent.specifier) != f"=={version}":
              sys.exit(f"::error::tag {tag}, version {version}, agent {agent.specifier}: they must agree")
          EOF

      # The published agent of this version, and the schemas of its release: what a user installs.
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag'
        with:
          repository: tracepanel/tracepanel
          ref: ${{ github.ref_name }}
          token: ${{ secrets.TRACEPANEL_AGENT_TOKEN || github.token }}
          path: tracepanel
          sparse-checkout: schema

      - name: Lint and test against the published agent
        if: github.ref_type == 'tag'
        run: |
          uv sync --no-sources $GROUPS
          uv run --no-sync poe lint
          TRACEPANEL_AGENT_BIN=$PWD/.venv/bin/tracepanel-agent uv run --no-sync pytest

      - name: Build
        run: uv build && uv run --no-project python scripts/check_dist.py

      - name: Publish
        run: >
          uv publish --trusted-publishing always
          ${{ github.ref_type != 'tag' && '--publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/' || '' }}
