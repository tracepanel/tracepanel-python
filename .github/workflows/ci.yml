name: CI

# A pull request runs a few of the jobs: the oldest and the newest Python and Django, PostgreSQL, Graphene, and the
# drivers when what they test changed. main, each night and a manual run run them all (plan, below).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A pull request's new push cancels its run before. main's runs all finish: a release waits for its commit's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# tracepanel requires tracepanel-agent, from the tracepanel repository checked out next to this one (uv.lock expects
# ../tracepanel). The agent job builds its wheel once per tracepanel commit, cached by that commit; every other job
# installs it rather than building the Rust binary itself (two minutes apiece).
env:
  GROUPS: >-
    --group celery --group channels --group strawberry --group django-tasks --group django-q2 --group fastapi --group dramatiq
    --group rq --group huey --group ninja --group drf --group flask --group falcon --group otel --group clients
    --group faststream --group taskiq --group llm --group aws --group snowflake

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      test: ${{ steps.matrix.outputs.test }}
      graphene: ${{ steps.matrix.outputs.graphene }}
      drivers: ${{ github.event_name != 'pull_request' || steps.changes.outputs.drivers == 'true' }}
    steps:
      # The drivers' job on a pull request: when the SQL and driver code, its tests or the environment changed.
      - if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            drivers:
              - "src/tracepanel/integrations/dbapi/**"
              - "src/tracepanel/integrations/sqlalchemy.py"
              - "src/tracepanel/integrations/mongodb.py"
              - "src/tracepanel/core/sql.py"
              - "src/tracepanel/core/explain.py"
              - "src/tracepanel/django/sql.py"
              - "src/tracepanel/django/explain.py"
              - "src/tracepanel/django/transactions.py"
              - "tests/integrations/dbapi/**"
              - "tests/integrations/test_mongodb.py"
              - "tests/integrations/test_sqlalchemy.py"
              - "tests/django/test_mssql.py"
              - "tests/django/test_explain.py"
              - "tests/django/test_transactions.py"
              - "tests/project/settings.py"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"
      # Every supported Python x Django pair on SQLite, and two on PostgreSQL (scripts/test_matrix.py has the same
      # pairs). A pull request: the oldest pair, the newest, and PostgreSQL on the newest Django.
      - id: matrix
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$PULL_REQUEST" = true ]; then
            test='[
              {"python": "3.11", "django": "5.2", "db": "sqlite"},
              {"python": "3.15", "django": "6.1", "db": "sqlite"},
              {"python": "3.14", "django": "6.1", "db": "postgres"}
            ]'
            graphene='[{"python": "3.14", "django": "6.1"}]'
          else
            test='[
              {"python": "3.11", "django": "5.2", "db": "sqlite"},
              {"python": "3.12", "django": "5.2", "db": "sqlite"},
              {"python": "3.12", "django": "6.0", "db": "sqlite"},
              {"python": "3.12", "django": "6.1", "db": "sqlite"},
              {"python": "3.13", "django": "5.2", "db": "sqlite"},
              {"python": "3.13", "django": "6.0", "db": "sqlite"},
              {"python": "3.13", "django": "6.1", "db": "sqlite"},
              {"python": "3.14", "django": "5.2", "db": "sqlite"},
              {"python": "3.14", "django": "6.0", "db": "sqlite"},
              {"python": "3.14", "django": "6.1", "db": "sqlite"},
              {"python": "3.15", "django": "6.1", "db": "sqlite"},
              {"python": "3.11", "django": "5.2", "db": "postgres"},
              {"python": "3.14", "django": "6.1", "db": "postgres"}
            ]'
            graphene='[{"python": "3.11", "django": "5.2"}, {"python": "3.14", "django": "6.1"}]'
          fi
          echo "test=$(jq -c . <<< "$test")" >> "$GITHUB_OUTPUT"
          echo "graphene=$(jq -c . <<< "$graphene")" >> "$GITHUB_OUTPUT"

  agent:
    name: tracepanel-agent wheel
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: tracepanel
      # The commit every job checks out: tracepanel's main may move during the run.
      - id: commit
        run: echo "sha=$(git -C tracepanel rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: wheel
          key: tracepanel-agent-wheel-${{ steps.commit.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.0
      # A binary, no Python code: one py3-none wheel serves every Python of the matrix.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: uv build --wheel tracepanel --out-dir wheel
      - uses: actions/upload-artifact@v7
        with:
          name: tracepanel-agent
          path: wheel/*.whl
          retention-days: 1

  lint:
    needs: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ needs.agent.outputs.sha }}
          path: tracepanel
      - uses: actions/download-artifact@v8
        with:
          name: tracepanel-agent
          path: agent
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: tracepanel-python
      # mysqlclient builds against the MySQL client library.
      - run: sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
      - run: uv sync --locked $GROUPS --group postgres --group drivers --group bench --no-install-package tracepanel-agent
      - run: uv pip install --no-deps ../agent/*.whl
      # poe runs its tasks through `uv run`, which would sync, and build the agent from ../tracepanel after all.
      - run: uv run --no-sync poe lint
        env:
          UV_NO_SYNC: "1"

  test:
    needs: [agent, plan]
    name: test (python ${{ matrix.python }}, django ${{ matrix.django }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracepanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRACEPANEL_TEST_DB: ${{ matrix.db }}
      PGHOST: localhost
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ needs.agent.outputs.sha }}
          path: tracepanel
      - uses: actions/download-artifact@v8
        with:
          name: tracepanel-agent
          path: agent
      # A uv cache per Python and set of groups (cache-suffix): with one per Python, the first job to save it would
      # leave the others' packages out.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          working-directory: tracepanel-python
          cache-suffix: ${{ matrix.db }}
      - run: uv sync --locked $GROUPS ${{ matrix.db == 'postgres' && '--group postgres' || '' }} --no-install-package tracepanel-agent
      - run: uv pip install --no-deps ../agent/*.whl
      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "django~=${{ matrix.django }}.0"
      - run: uv run --no-sync python -c "import django, sys; print('django', django.get_version(), 'python', sys.version)"
      # The agent installed from the wheel is the one the tests compare with (tests/storage/test_agent.py). poe runs
      # pytest with a worker per core, through `uv run`: UV_NO_SYNC keeps the environment synced above.
      - run: uv run --no-sync poe test
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent
          UV_NO_SYNC: "1"

  graphene:
    # Graphene needs graphql-core < 3.3, Strawberry 3.3: the same groups with graphene in strawberry's place.
    needs: [agent, plan]
    name: graphene (python ${{ matrix.python }}, django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.graphene) }}
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ needs.agent.outputs.sha }}
          path: tracepanel
      - uses: actions/download-artifact@v8
        with:
          name: tracepanel-agent
          path: agent
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          working-directory: tracepanel-python
          cache-suffix: graphene
      - run: uv sync --locked ${GROUPS/--group strawberry/--group graphene} --no-install-package tracepanel-agent
      - run: uv pip install --no-deps ../agent/*.whl
      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "django~=${{ matrix.django }}.0"
      - run: uv run --no-sync poe test
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent
          UV_NO_SYNC: "1"

  snowflake5:
    # Snowflake's connector 5.x (a Rust core, and snowflake-sqlalchemy on it) can't share an environment with 4.x, which
    # the other jobs test: its tests, against the local stand-in for Snowflake's API.
    needs: [agent]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ needs.agent.outputs.sha }}
          path: tracepanel
      - uses: actions/download-artifact@v8
        with:
          name: tracepanel-agent
          path: agent
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          working-directory: tracepanel-python
          cache-suffix: snowflake5
      - run: uv sync --locked --group snowflake5 --no-install-package tracepanel-agent
      - run: uv pip install --no-deps ../agent/*.whl
      - run: uv run --no-sync pytest tests/integrations/dbapi/test_snowflake.py
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent

  drivers:
    # The database drivers on their servers, with Django and SQLAlchemy on the same drivers: each statement once; and
    # MongoDB's commands.
    # Oracle's image takes over a minute to start: it runs on main only, not on each pull request. A pull request runs
    # the job only when what it tests changed (plan).
    name: drivers (PostgreSQL, MySQL, SQL Server, ${{ github.event_name != 'pull_request' && 'Oracle, ' || '' }}MongoDB)
    needs: [agent, plan]
    if: needs.plan.outputs.drivers == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracepanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tracepanel
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql" --health-interval 5s --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Tracepanel-1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Tracepanel-1 -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      oracle:
        image: ${{ github.event_name != 'pull_request' && 'gvenzl/oracle-free:23-slim-faststart' || '' }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: tracepanel
          APP_USER_PASSWORD: tracepanel
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        env:
          # MongoDB 8's TCMalloc refuses to start on Linux 6.19 and newer, which the runners have (SERVER-121912):
          # this lets it start; harmless on older kernels.
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TRACEPANEL_TEST_DB: postgres
      PGHOST: localhost
      TRACEPANEL_TEST_MYSQL: "1"
      TRACEPANEL_TEST_MSSQL: "1"
      TRACEPANEL_TEST_ORACLE: ${{ github.event_name != 'pull_request' && '1' || '' }}
      ORACLE_DSN: localhost:1521/FREEPDB1
      TRACEPANEL_TEST_MONGO: mongodb://localhost:27017
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          ref: ${{ needs.agent.outputs.sha }}
          path: tracepanel
      - uses: actions/download-artifact@v8
        with:
          name: tracepanel-agent
          path: agent
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          working-directory: tracepanel-python
          cache-suffix: drivers
      - run: sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
      # pyodbc (and mssql-django on it) talks to SQL Server through Microsoft's ODBC driver: installed when missing.
      - name: Microsoft ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" > /dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18
          fi
      - run: uv sync --locked $GROUPS --group postgres --group drivers --no-install-package tracepanel-agent
      - run: uv pip install --no-deps ../agent/*.whl
      - run: uv run --no-sync poe test
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent
          UV_NO_SYNC: "1"
