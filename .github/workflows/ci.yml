name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# tracepanel requires tracepanel-agent, built from the tracepanel repository checked out next to this one (uv.lock
# expects ../tracepanel).
env:
  GROUPS: >-
    --group celery --group channels --group strawberry --group django-tasks --group fastapi --group dramatiq
    --group rq --group ninja --group drf --group flask --group falcon --group otel

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: tracepanel
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: tracepanel-python
      # mysqlclient builds against the MySQL client library.
      - run: sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
      - run: uv sync --locked $GROUPS --group postgres --group drivers
      - run: uv run poe lint

  test:
    name: test (python ${{ matrix.python }}, django ${{ matrix.django }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        django: ["5.2", "6.0", "6.1"]
        db: [sqlite]
        exclude:
          # Django 6.x requires Python 3.12+.
          - { python: "3.11", django: "6.0" }
          - { python: "3.11", django: "6.1" }
          # Python 3.15 came after Django 5.2 and 6.0: only 6.1 runs on it.
          - { python: "3.15", django: "5.2" }
          - { python: "3.15", django: "6.0" }
        include:
          - { python: "3.11", django: "5.2", db: postgres }
          - { python: "3.14", django: "6.1", db: postgres }
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracepanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRACEPANEL_TEST_DB: ${{ matrix.db }}
      PGHOST: localhost
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: tracepanel
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          working-directory: tracepanel-python
      - run: uv sync --locked $GROUPS ${{ matrix.db == 'postgres' && '--group postgres' || '' }}
      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "django~=${{ matrix.django }}.0"
      - run: uv run --no-sync python -c "import django, sys; print('django', django.get_version(), 'python', sys.version)"
      # The agent uv built is the one the tests compare with (tests/storage/test_agent.py).
      - run: uv run --no-sync pytest
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent

  drivers:
    # The database drivers on their servers, with Django and SQLAlchemy on the same drivers: each statement once.
    name: drivers (PostgreSQL, MySQL, Oracle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracepanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tracepanel
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql" --health-interval 5s --health-timeout 5s
          --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: tracepanel
          APP_USER_PASSWORD: tracepanel
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      TRACEPANEL_TEST_DB: postgres
      PGHOST: localhost
      TRACEPANEL_TEST_MYSQL: "1"
      TRACEPANEL_TEST_ORACLE: "1"
      ORACLE_DSN: localhost:1521/FREEPDB1
    defaults:
      run:
        working-directory: tracepanel-python
    steps:
      - uses: actions/checkout@v7
        with:
          path: tracepanel-python
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: tracepanel
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          working-directory: tracepanel-python
      - run: sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
      - run: uv sync --locked $GROUPS --group postgres --group drivers
      - run: uv run --no-sync pytest
        env:
          TRACEPANEL_AGENT_BIN: ${{ github.workspace }}/tracepanel-python/.venv/bin/tracepanel-agent
