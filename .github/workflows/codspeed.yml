name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build up initial performance data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      # CodSpeed reads the commit from the repository at the workspace root: this one is checked out there.
      - uses: actions/checkout@v7
      # tracepanel requires tracepanel-agent, built from the tracepanel repository next to this one (uv.lock expects
      # ../tracepanel). actions/checkout only writes inside the workspace: link it from there.
      - uses: actions/checkout@v7
        with:
          repository: tracepanel/tracepanel
          path: .deps/tracepanel
      - run: ln -s "$GITHUB_WORKSPACE/.deps/tracepanel" ../tracepanel
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run --no-sync pytest tests/benchmarks --codspeed
