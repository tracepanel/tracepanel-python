[project]
name = "tracepanel"
version = "0.7.0"
description = "Traces and logs for Python apps: every request, task and command with its SQL and log lines, N+1 queries found"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The agent stores, analyzes and serves the console: any patch of this package's minor version. A minor is released
# together with the agent's, a patch on its own. It has wheels for these platforms: elsewhere tracepanel installs
# without it (its sdist needs Rust to build).
dependencies = [
    """tracepanel-agent>=0.7.0,<0.8; \
    (sys_platform == "linux" and (platform_machine == "x86_64" or platform_machine == "aarch64" \
        or platform_machine == "armv7l" or platform_machine == "armv6l" or platform_machine == "i686" \
        or platform_machine == "ppc64le" or platform_machine == "s390x" or platform_machine == "riscv64")) \
    or sys_platform == "darwin" \
    or (sys_platform == "win32" and (platform_machine == "AMD64" or platform_machine == "ARM64" \
        or platform_machine == "x86"))""",
]
keywords = ["debug toolbar", "django", "fastapi", "flask", "n+1", "sql", "tracing", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Pytest",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Frameworks: Django is one of them, not a requirement (`pip install django-tracepanel` is the same as this extra).
django = ["django>=5.2"]
celery = ["celery>=5.3"]
dramatiq = ["dramatiq>=1.17"]
faststream = ["faststream>=0.6"]
rq = ["rq>=2.0"]
huey = ["huey>=2.5"]
taskiq = ["taskiq>=0.13"]
django-q2 = ["django-q2>=1.9"]
channels = ["channels>=4.2"]
strawberry = ["strawberry-graphql>=0.250"]
fastapi = ["fastapi>=0.142"]
starlette = ["starlette>=0.40"]
flask = ["flask>=3.0"]
falcon = ["falcon>=4.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
mongodb = ["pymongo>=4.13"]
ninja = ["django-ninja>=1.4"]
drf = ["djangorestframework>=3.15"]
otel = ["opentelemetry-sdk>=1.45"]

[project.scripts]
tracepanel = "tracepanel._cli:main"

# Loaded by pytest wherever tracepanel is installed, and off until `pytest --tracepanel` (or `tracepanel = true`).
[project.entry-points.pytest11]
tracepanel = "tracepanel.pytest_plugin"

[project.urls]
Homepage = "https://tracepanel.dev"
Documentation = "https://tracepanel.dev/docs/python"
Repository = "https://github.com/tracepanel/tracepanel-python"
Issues = "https://github.com/tracepanel/tracepanel-python/issues"
Changelog = "https://github.com/tracepanel/tracepanel-python/blob/main/CHANGELOG.md"

[dependency-groups]
# CodSpeed's pytest plugin: tests/benchmarks runs with it.
bench = [
    "pytest-codspeed>=5.0.3",
]
celery = [
    "celery>=5.6.3",
]
channels = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    # fakeredis runs channels-redis's Lua scripts with lupa, which has no wheel for Python 3.15 yet.
    "lupa>=2.8 ; python_full_version < '3.15'",
]
dev = [
    # The test project is a Django project (the other frameworks' tests use their own groups).
    "django>=5.2",
    "pytest",
    "pytest-django",
    # The suite runs in parallel, a process per core (poe test).
    "pytest-xdist>=3.8",
    "jsonschema",
    "types-jsonschema",
    "ruff>=0.16",
    "pyrefly>=1.3",
    "poethepoet>=0.48",
    "django-stubs>=5.2",
    "dirty-equals>=0.11",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "celery-types>=0.26.0",
    "import-linter>=2.15",
]
django-tasks = [
    "django-tasks>=0.12.0",
    "django-tasks-db>=0.13.0",
]
django-q2 = [
    "django-q2>=1.11.1",
]
postgres = ["psycopg[binary]>=3.2"]
# The HTTP clients and Redis clients tracepanel wraps (httpx2 comes with the fastapi group, fakeredis with rq).
clients = [
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "aiohttp>=3.14.5",
    "redis>=8.1.0",
    "fakeredis>=2.39.0",
]
# The database drivers tracepanel wraps when they are used without an ORM (their servers: see CONTRIBUTING).
drivers = [
    "aiosqlite>=0.22.1",
    "psycopg2-binary>=2.9.13",
    "asyncpg>=0.32.0",
    "pymysql>=1.2.3",
    "mysqlclient>=2.3.0",
    "mysql-connector-python>=26.7.0",
    "aiomysql>=0.3.2",
    "oracledb>=26.0.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "pymongo>=4.18.3",
    "asyncmy>=0.2.16",
    "pymssql>=2.4.5",
    # pyodbc has no wheel for Python 3.15 yet, and needs unixODBC to build; Microsoft's ODBC driver is installed apart.
    "pyodbc>=5.3.0; python_full_version < '3.15'",
    # mssql-django 2 brings mssql-python, whose macOS wheels need macOS 15; pyodbc stays its default driver.
    "mssql-django>=1.8,<2; python_full_version < '3.15'",
]
# Snowflake's connector against a local stand-in for its REST API (tests/integrations/dbapi/snowflakestub.py): 4.x,
# whose own copy of requests and urllib3 (aiohttp for asyncio) makes its HTTP calls. 5.x makes them in its Rust core:
# the snowflake5 group, an environment of its own (tool.uv's conflicts), with snowflake-sqlalchemy, which needs 5.x
# for SQLAlchemy 2.1. Neither has a wheel for Python 3.15 yet.
snowflake = [
    "snowflake-connector-python>=4.8.1,<5; python_full_version < '3.15'",
    "aiohttp>=3.14.5",
]
snowflake5 = [
    "snowflake-connector-python>=5.1.0; python_full_version < '3.15'",
    "snowflake-sqlalchemy>=2.1.0; python_full_version < '3.15'",
    "sqlalchemy>=2.1.4",
]
strawberry = [
    "strawberry-graphql>=0.332.0",
]
# Graphene needs graphql-core < 3.3, Strawberry 3.3: each has an environment of its own (tool.uv's conflicts).
graphene = [
    "graphene-django>=3.2.3",
]
dramatiq = [
    "dramatiq>=2.2.1",
    "redis>=8.1.0",
]
rq = [
    "rq>=2.12.0",
    "fakeredis>=2.39.0",
]
huey = [
    "huey>=3.4.0",
]
fastapi = [
    "fastapi>=0.142.4",
    "httpx2>=2.13.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]
ninja = [
    "django-ninja>=1.7.1",
]
drf = [
    "djangorestframework>=3.18.3",
]
otel = [
    "opentelemetry-sdk>=1.45.1",
]
flask = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "sqlalchemy>=2.1.4",
]
falcon = [
    "falcon>=4.2",
]
# Its brokers' clients, tested in memory (TestKafkaBroker and the others), and FastAPI: FastStream's own routers and
# faststream-fastapi, which replaces them. confluent-kafka has no wheel for Python 3.15 yet, and needs librdkafka to
# build.
faststream = [
    "faststream[kafka,nats,rabbit,redis]>=0.7.7",
    "faststream[confluent]>=0.7.7; python_full_version < '3.15'",
    "faststream-fastapi>=1.4.0",
    "fastapi>=0.142.4",
    "httpx2>=2.13.1",
]
taskiq = [
    "taskiq>=0.13.0",
    "taskiq-fastapi>=0.5.0",
]
# The LLM SDKs tracepanel wraps, tested against a local stub of their APIs.
llm = [
    "openai>=3.37.0",
    "anthropic>=2.3.0",
]
# AWS through botocore (boto3, aiobotocore), against moto's AWS served from a thread of the test process (its
# server's own dependencies: flask, flask-cors); django-storages' S3Storage on top.
aws = [
    "boto3>=1.43",
    "aiobotocore>=3.10",
    "moto[s3,dynamodb]>=5.2.4",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "django-storages[s3]>=1.14.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ group = "strawberry" }, { group = "graphene" }], [{ group = "snowflake" }, { group = "snowflake5" }]]

[tool.uv.sources]
# In development: built from the tracepanel repository checked out next to this one (Rust). `uv sync --no-sources` uses
# the published agent instead.
tracepanel-agent = { path = "../tracepanel" }

[tool.uv.build-backend]
module-name = "tracepanel"

[tool.ruff]
src = ["src", "."]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY",    # no copyright headers
    "D1",     # docstrings where they add information, not on every definition
]

[tool.ruff.lint.flake8-tidy-imports]
# Full import paths everywhere: from tracepanel.core.context import current_trace.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# tracepanel.integrations.celery and friends are named after the libraries: those names stay third-party.
known-third-party = ["celery", "channels", "faststream", "strawberry", "graphene", "graphene_django", "ninja", "rest_framework", "django", "fastapi", "flask", "falcon", "starlette", "sqlalchemy", "opentelemetry", "openai", "anthropic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest asserts
    "PLR2004", # literal expectations read better in tests
    "ARG001",  # Django views and fixtures receive arguments they don't use
    "ARG002",  # so do consumer handlers
    "S105",    # test passwords
    "S106",
]
"**/migrations/**" = ["RUF012"] # generated by makemigrations
"src/tracepanel/_cli.py" = ["T201"] # the CLI prints
"src/tracepanel/_bootstrap/sitecustomize.py" = ["INP001"] # on PYTHONPATH for `tracepanel run`, never imported as a package
"scripts/*.py" = ["INP001"] # standalone scripts, not a package
"scripts/bench.py" = ["INP001", "T201"] # prints its report
"scripts/test_matrix.py" = ["INP001", "T201"] # prints its report

[tool.poe.tasks.build]
help = "Build the wheel and sdist into dist/, and check what they hold"
sequence = ["uv build", "python scripts/check_dist.py"]
default_item_type = "cmd"

[tool.poe.tasks.test-matrix]
help = "Tests on every supported Python x Django pair, as CI runs them (scripts/test_matrix.py)"
cmd = "python scripts/test_matrix.py"

[tool.poe.tasks.bench]
help = "Overhead per request, memory over many requests (scripts/bench.py)"
cmd = "python scripts/bench.py"

[tool.poe.tasks.test]
# loadgroup: the tests marked xdist_group("name") run in one worker, in order (they share a server's table). Arguments
# after it go to pytest: `poe test -n 0` runs in this process alone.
help = "Run the test suite, a worker per core (pytest-xdist; -n 0 runs it in one process)"
cmd = "pytest -n auto --dist loadgroup"

[tool.poe.tasks.fmt]
help = "Fix lint issues and format code"
sequence = ["ruff check --fix .", "ruff format ."]
default_item_type = "cmd"

[tool.poe.tasks.lint]
help = "Check linting, formatting, types, imports and the docs (runs every check, fails if any fails)"
sequence = ["ruff check .", "ruff format --check .", "pyrefly check", "lint-imports", "python scripts/lint_docs.py"]
default_item_type = "cmd"
ignore_fail = "return_non_zero"

[tool.pytest.ini_options]
# pytester: the plugin's tests run pytest on test files of their own (tests/test_pytest_plugin.py).
addopts = "-p pytester"
DJANGO_SETTINGS_MODULE = "tests.project.settings"
pythonpath = ["."]
django_debug_mode = true

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["src/tracepanel", "tests", "scripts"]
search-path = ["src", "."]
# Graphene can't share an environment with Strawberry (graphql-core < 3.3): the lint environment has Strawberry.
ignore-missing-imports = ["graphene", "graphene.*", "graphene_django", "graphene_django.*"]

# Django is the framework tracepanel is built for, but only tracepanel.django knows it: the core, the transport, the console
# and the framework-free integrations stay neutral, so another framework could sit next to tracepanel.django.
[tool.importlinter]
root_package = "tracepanel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the framework integrations (tracepanel.django, .fastapi, .flask, .falcon) import their framework"
# tracepanel.asgi and tracepanel.wsgi work on any app by duck typing: they import no framework either.
type = "forbidden"
source_modules = [
    "tracepanel.core", "tracepanel.storage", "tracepanel.console", "tracepanel.integrations", "tracepanel.api", "tracepanel.asgi",
    "tracepanel.wsgi",
]
forbidden_modules = ["django", "channels", "fastapi", "starlette", "flask", "werkzeug", "falcon"]

[[tool.importlinter.contracts]]
name = "Layers: the framework integration on top, the core at the bottom"
type = "layers"
layers = [
    "tracepanel.django | tracepanel.fastapi | tracepanel.flask | tracepanel.falcon",
    "tracepanel.asgi | tracepanel.wsgi",
    "tracepanel.integrations | tracepanel.console | tracepanel.api",
    "tracepanel.storage",
    "tracepanel.core",
]
